[workspace]
members = [
    "crates/init",
    "crates/shell",
    "crates/coreutils",
    "crates/xiee-common",
    "crates/xiee-gui",
    "crates/xiee-desktop",
    "crates/xiac",
    "crates/xihh-key",
    "crates/winyy",
    "crates/xiee-login",
    "crates/xfm",
]
exclude = ["xiarr/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Miki"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["process", "signal", "fs", "user"] }
egui = "0.31"
eframe = { version = "0.31", features = ["default"] }
image = { version = "0.25", features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
